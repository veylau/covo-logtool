<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COVO-log (alleen-lezen)</title>
  <style>
:root {
  --bg: #f4f5f7;
  --kaart: #ffffff;
  --tekst: #1f2328;
  --zacht: #656d76;
  --lijn: #d8dde3;
  --lijn-zacht: #eceff2;
  --accent: #2f5d8a;
  --accent-zacht: #e6eef6;
  --ok: #1a7f37;
  --nok: #b42318;
  --waarsch-bg: #fff8e1;
  --waarsch-lijn: #e7c66b;
  --concept: #8a5a00;
  --radius: 6px;
  /* kleur per onderdeeltype */
  --kl-covo: #2f5d8a;
  --kl-tobe-zonder: #7a4a94;
  --kl-tobe-met: #17766a;
  --onderdeel: var(--kl-covo);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16191d; --kaart: #1f2328; --tekst: #e6e8eb; --zacht: #9aa4ae;
    --lijn: #3a4047; --lijn-zacht: #2b3036; --accent: #7fb0e0; --accent-zacht: #23303d;
    --ok: #56c271; --nok: #f07167; --waarsch-bg: #3a3220; --waarsch-lijn: #7d6a2f; --concept: #e0b45c;
    --kl-covo: #7fb0e0; --kl-tobe-zonder: #c39be0; --kl-tobe-met: #5cc7b5;
  }
}
body[data-type="tobe-zonder"] { --onderdeel: var(--kl-tobe-zonder); }
body[data-type="tobe-met"] { --onderdeel: var(--kl-tobe-met); }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--tekst);
  font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
}
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.25; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
h4 { font-size: .9rem; margin-top: .8em; color: var(--zacht); text-transform: uppercase; letter-spacing: .03em; }
code, kbd, pre, textarea { font-family: Consolas, "Cascadia Mono", monospace; }
kbd { border: 1px solid var(--lijn); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; font-size: .85em; }
small { font-weight: normal; }
.hint { color: var(--zacht); font-size: .85em; }
.leeg { color: var(--zacht); font-style: italic; }
.ok { color: var(--ok); }
.nok { color: var(--nok); }
.flex { flex: 1; }
.pre-wrap { white-space: pre-wrap; }
[hidden] { display: none !important; }

/* ---------- balk ---------- */
.balk {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 8px 16px; background: var(--kaart); border-bottom: 1px solid var(--lijn);
  border-top: 5px solid var(--onderdeel);
}
.onderdeel-keuze { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--onderdeel); }
.onderdeel-keuze select { width: auto; font-weight: 600; color: var(--onderdeel); border: 2px solid var(--onderdeel); }
.onderdeel-keuze select:disabled { opacity: .7; cursor: not-allowed; }
body:not(.geladen) .onderdeel-keuze { visibility: hidden; }
.badge.onderdeel { background: var(--onderdeel); border-color: var(--onderdeel); color: var(--kaart); font-weight: 600; font-size: .85em; }
.badge.rt-wijziging { border-color: var(--kl-tobe-met); color: var(--kl-tobe-met); }
.badge.rt-correctie { border-color: var(--nok); color: var(--nok); }
.balk h1 { font-size: 1.05rem; margin: 0; }
.balk nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
body:not(.geladen) .balk nav { visibility: hidden; }
.balk .scheiding { width: 1px; height: 22px; background: var(--lijn); margin: 0 6px; }
.balk .status { margin-left: auto; display: flex; gap: 12px; color: var(--zacht); font-size: .85em; }
#opslagstatus.fout { color: var(--nok); font-weight: 600; }
nav button.actief { background: var(--accent-zacht); border-color: var(--accent); color: var(--accent); }

#melding {
  position: fixed; right: 16px; bottom: 16px; z-index: 20; max-width: 460px;
  padding: 10px 14px; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.18);
  background: var(--kaart); border-left: 4px solid var(--accent);
}
#melding.fout { border-left-color: var(--nok); cursor: pointer; }
#melding.waarsch { border-left-color: var(--waarsch-lijn); }

main { max-width: 1440px; margin: 0 auto; padding: 16px; }
.kaart { background: var(--kaart); border: 1px solid var(--lijn); border-radius: var(--radius); padding: 16px 20px; }
.start { max-width: 640px; margin: 48px auto; }
.kop-rij { display: flex; align-items: baseline; gap: 12px; }

/* ---------- formulieren ---------- */
button {
  font: inherit; padding: 5px 12px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--lijn); background: var(--kaart); color: var(--tekst);
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primair { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { button.primair { color: #10161c; } }
button.volgende { background: var(--accent-zacht); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.volgende:hover:not(:disabled) { background: var(--accent); color: var(--kaart); }
button.gevaar { color: var(--nok); }
button.primair.gevaar { background: var(--nok); border-color: var(--nok); color: #fff; }
button.klein { padding: 1px 8px; font-size: .85em; }
input[type=text], input[type=date], input[type=time], select, textarea {
  font: inherit; color: inherit; background: var(--kaart);
  border: 1px solid var(--lijn); border-radius: var(--radius); padding: 5px 8px; width: 100%;
}
textarea { font-size: 12.5px; resize: vertical; }
input:focus, select:focus, textarea:focus, .plakvak:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.kort { max-width: 140px; }
.veld { display: block; margin: 0 0 14px; }
.veld > .label { display: block; font-weight: 600; margin-bottom: 4px; }
.rij { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.rij > .veld { flex: 0 0 auto; }
.rij > .veld.breed { flex: 1 1 220px; }
.inline { display: flex; gap: 6px; margin-top: 6px; }
.keuzes { display: flex; gap: 4px 14px; flex-wrap: wrap; align-items: center; }
.keuze { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.verplicht { color: var(--nok); font-size: .8em; font-weight: 600; }

/* ---------- invoer ---------- */
.ed-kop { display: flex; align-items: center; gap: 12px; }
.ed-kop h2 { margin: 0; }
.info { color: var(--zacht); margin: 4px 0 10px; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--lijn); margin: 8px 0 16px; }
.tabs button {
  border: 1px solid transparent; border-bottom: none; border-radius: var(--radius) var(--radius) 0 0;
  margin-bottom: -1px; padding: 8px 16px; background: transparent;
}
.tabs button small { color: var(--zacht); }
.tabs button.actief { background: var(--kaart); border-color: var(--lijn); border-bottom: 1px solid var(--kaart); font-weight: 600; }
.ed-voet {
  position: sticky; bottom: 0; display: flex; gap: 8px; flex-wrap: wrap;
  padding: 12px 0 4px; margin-top: 12px; background: var(--kaart); border-top: 1px solid var(--lijn);
}

details.output { border: 1px solid var(--lijn); border-radius: var(--radius); margin: 0 0 14px; }
details.output > summary { padding: 8px 12px; cursor: pointer; }
details.output .samenv { color: var(--zacht); font-weight: normal; }
.output-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr); gap: 12px; padding: 0 12px 12px; }
.parsed { font-size: .9em; background: var(--bg); border-radius: var(--radius); padding: 8px 12px; overflow: auto; max-height: 460px; }
.parsed-kop { margin-bottom: 6px; }
ul.secties { padding-left: 18px; margin: 0; }

.plakvak {
  border: 2px dashed var(--lijn); border-radius: var(--radius); padding: 10px; min-height: 80px; cursor: copy;
}
.plakvak.sleep { border-color: var(--accent); background: var(--accent-zacht); }
.plakvak img { display: block; max-width: 100%; max-height: 420px; margin: 6px 0; border: 1px solid var(--lijn-zacht); }
.plakvak .hint { margin: 4px 0 0; }
.shot-kop { display: flex; gap: 8px; align-items: center; }
.shots-lijst { display: flex; flex-direction: column; gap: 8px; }
.plakvak.gevuld { border-style: solid; cursor: default; }
.plakvak.nieuw { min-height: 0; color: var(--zacht); }
.nr { display: inline-block; min-width: 22px; text-align: center; border-radius: 999px; background: var(--accent-zacht); color: var(--accent); font-weight: 600; font-size: .85em; }
.leeg-shot { color: var(--zacht); font-style: italic; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
.chips-label { color: var(--zacht); font-size: .85em; min-width: 110px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
  border: 1px solid var(--lijn); border-radius: 999px; cursor: pointer; font-size: .9em;
}
.chip.in-output { border-color: var(--accent); }
.chip:has(input:checked) { background: var(--accent-zacht); border-color: var(--accent); font-weight: 600; }
.tel { background: var(--lijn-zacht); border-radius: 999px; padding: 0 6px; font-size: .85em; font-weight: 600; }

.melding-blok { border: 1px solid var(--lijn); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 8px; }
.melding-kop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.items { display: flex; flex-direction: column; gap: 2px; margin: 4px 0; }
.item { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; font-size: .92em; }
.item input { margin-top: 3px; }
.melding-blok textarea { margin-top: 4px; }
.viewlijst { columns: 380px 2; column-gap: 16px; border: 1px solid var(--lijn); border-radius: var(--radius); padding: 8px 12px; }
.viewlijst .item { break-inside: avoid; padding: 1px 0; }
.item:has(input:checked) { font-weight: 600; }

table.acties { border-collapse: collapse; margin-bottom: 6px; }
table.acties th, table.acties td { padding: 4px 12px; border-bottom: 1px solid var(--lijn-zacht); text-align: center; }
table.acties th:first-child { text-align: left; }
table.acties td { white-space: nowrap; }
input.aantal { width: 58px; padding: 2px 4px; text-align: right; }
table.acties input[type=checkbox] + input.aantal { width: 48px; margin-left: 4px; }
.duur { padding: 5px 0; }
.nieuwe-meldingen { margin-top: 6px; border-left: 3px solid var(--nok); padding: 2px 10px; }
.nieuwe-meldingen ul { margin: 2px 0 0; padding-left: 18px; }
.herz-nieuw { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.herz-nieuw input[type=text] { width: 260px; }

.waarsch { background: var(--waarsch-bg); border: 1px solid var(--waarsch-lijn); border-radius: var(--radius); padding: 8px 12px; margin: 8px 0; }
.waarsch ul { margin: 4px 0 0; padding-left: 20px; }
.waarsch.klein { font-size: .9em; padding: 4px 8px; }

.badge { display: inline-block; font-size: .78em; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--lijn); white-space: nowrap; }
.badge.concept { color: var(--concept); border-color: var(--concept); }
.badge.afgerond { color: var(--ok); border-color: var(--ok); }
.badge.waarsch { background: var(--waarsch-bg); border-color: var(--waarsch-lijn); padding: 1px 6px; margin: 0; }
.badge.vast { color: var(--ok); border-color: var(--ok); }
.badge.live { color: var(--concept); border-color: var(--concept); }
.status.ok { color: var(--ok); font-weight: 600; }
.status.nok { color: var(--nok); font-weight: 600; }

table.mini { border-collapse: collapse; font-size: .92em; }
table.mini th, table.mini td { padding: 2px 8px; border-bottom: 1px solid var(--lijn-zacht); text-align: left; vertical-align: top; }
table.mini td.getal, table.mini th.getal { text-align: right; font-variant-numeric: tabular-nums; }
table.mini tr.totaal th, table.mini tr.totaal td { border-top: 1px solid var(--lijn); font-weight: 600; }
table.mini tr.nok td, table.mini tr.nok th { color: var(--nok); }
table.mini tr.ok td, table.mini tr.ok th { color: var(--ok); }
.gevolg-tekst { font-weight: 600; margin: 0 0 4px; }

/* ---------- filters ---------- */
.filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 8px 0 14px; padding: 8px 12px; background: var(--bg); border-radius: var(--radius); }
.filters select { width: auto; max-width: 340px; }

/* ---------- tijdlijn ---------- */
table.tijdlijn { width: 100%; border-collapse: collapse; }
table.tijdlijn th { text-align: left; font-size: .85em; color: var(--zacht); border-bottom: 1px solid var(--lijn); padding: 6px 8px; }
table.tijdlijn td { padding: 6px 8px; border-bottom: 1px solid var(--lijn-zacht); vertical-align: top; }
tr.rec { cursor: pointer; }
tr.rec:hover td { background: var(--accent-zacht); }
tr.rec.open td { background: var(--accent-zacht); border-bottom-color: transparent; }
td.view-kol { max-width: 260px; }
table.tijdlijn td.getal { text-align: right; white-space: nowrap; }
table.tabel td { padding: 4px 8px; font-size: .93em; }
table.tabel th.sorteerbaar { cursor: pointer; user-select: none; white-space: nowrap; }
table.tabel th.sorteerbaar:hover { color: var(--tekst); }
table.tabel th.op::after { content: ' ▲'; }
table.tabel th.af::after { content: ' ▼'; }
.detail-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.detail-nav .positie { min-width: 140px; text-align: center; }
.kop-rij .badge.onderdeel { align-self: center; }
td.badges { white-space: nowrap; text-align: right; }
tr.detail > td { background: var(--accent-zacht); padding: 0 8px 12px; }
.detail-inhoud { background: var(--kaart); border: 1px solid var(--lijn); border-radius: var(--radius); padding: 12px 16px; }
.detail-knoppen { display: flex; gap: 8px; justify-content: flex-end; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; margin: 8px 0; }
.detail-grid dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.detail-grid dt { color: var(--zacht); font-size: .9em; }
.detail-grid dd { margin: 0; }
ul.meld { margin: 0; padding-left: 18px; }
ul.meld ul { padding-left: 16px; font-size: .92em; }
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shots figure { margin: 0; }
.shots figcaption { font-size: .85em; color: var(--zacht); margin-bottom: 4px; }
.shots img { width: 100%; border: 1px solid var(--lijn); cursor: zoom-in; }
pre.ruw { max-height: 420px; overflow: auto; background: var(--bg); padding: 8px 12px; border-radius: var(--radius); font-size: 12px; white-space: pre; }
.detail-inhoud details { margin-top: 6px; }
.detail-inhoud summary { cursor: pointer; color: var(--accent); }

/* ---------- overzicht ---------- */
.groep { border-top: 1px solid var(--lijn); padding-top: 12px; margin-top: 12px; }
.groep h3 small { color: var(--zacht); }
.groep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px 28px; }
.groep-grid h4 { margin-top: .4em; }
ul.lijst { margin: 0; padding-left: 18px; }

table.mini.breed { margin-bottom: 4px; }
table.mini tfoot th, table.mini tfoot td { border-top: 2px solid var(--lijn); font-weight: 600; }
table.acties-soort th { text-align: center; }
table.vergelijking th.z, table.vergelijking td.z { background: color-mix(in srgb, var(--kl-tobe-zonder) 10%, transparent); }
table.vergelijking th.m, table.vergelijking td.m { background: color-mix(in srgb, var(--kl-tobe-met) 10%, transparent); }
table.vergelijking th { text-align: center; }

/* ---------- instellingen ---------- */
.instellingen { max-width: 1200px; }
table.onderdelen input[type=text] { min-width: 120px; }
.views-per-onderdeel { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 14px; }
.views-per-onderdeel textarea { font-size: 12px; }
.badge.onderdeel.o-covo { background: var(--kl-covo); border-color: var(--kl-covo); }
.badge.onderdeel.o-tobe-zonder { background: var(--kl-tobe-zonder); border-color: var(--kl-tobe-zonder); }
.badge.onderdeel.o-tobe-met { background: var(--kl-tobe-met); border-color: var(--kl-tobe-met); }

/* ---------- viewer (alleen-lezen) ---------- */
body.viewer [data-scherm="invoer"], body.viewer [data-scherm="instellingen"],
body.viewer .detail-knoppen { display: none !important; }
body.viewer #mapnaam { font-weight: 600; color: var(--onderdeel); }

/* ---------- lightbox ---------- */
#lb { position: fixed; inset: 0; z-index: 30; background: #0d0f12; color: #fff; display: flex; flex-direction: column; }
.lb-kop { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(0,0,0,.4); }
.lb-run { font-size: 1.4rem; font-weight: 700; }
.lb-run, .lb-moment, .lb-teller { white-space: nowrap; }
.lb-naam { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-moment { font-size: 1.1rem; font-weight: 700; padding: 2px 12px; border-radius: 999px; letter-spacing: .05em; }
.lb-moment.pre { background: #c26a00; }
.lb-moment.aft { background: #1a7f37; }
.lb-naam { font-family: Consolas, monospace; opacity: .8; }
.lb-teller { opacity: .8; font-variant-numeric: tabular-nums; }
#lb button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3); }
#lb button:hover:not(:disabled) { background: rgba(255,255,255,.15); }
.lb-beeld { flex: 1; min-height: 0; display: flex; align-items: center; gap: 12px; padding: 12px; }
.lb-beeld img { flex: 1; min-width: 0; max-height: 100%; object-fit: contain; }
#lb .lb-pijl { font-size: 2.4rem; line-height: 1; padding: 8px 14px; border: none; }
.lb-voet { text-align: center; font-size: .8rem; opacity: .6; padding: 6px; }
.plakvak img, .shots img { cursor: zoom-in; }

dialog { border: 1px solid var(--lijn); border-radius: var(--radius); background: var(--kaart); color: var(--tekst); max-width: 640px; width: 90vw; padding: 16px 20px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog .knoppen { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

@media (max-width: 900px) {
  .output-grid, .detail-grid { grid-template-columns: 1fr; }
  .detail-grid dl { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <header class="balk">
    <h1>COVO-logtool</h1>
    <label class="onderdeel-keuze">Onderdeel <select id="onderdeel"></select></label>
    <nav id="nav">
      <button type="button" data-scherm="invoer" id="nav-invoer">+ Nieuw record</button>
      <button type="button" data-scherm="tabel">Tabel</button>
      <button type="button" data-scherm="tijdlijn">Tijdlijn</button>
      <button type="button" data-scherm="overzicht">Overzicht</button>
      <button type="button" data-scherm="vergelijking" id="nav-vergelijking">Vergelijking TO-BE</button>
      <button type="button" data-scherm="instellingen">Instellingen</button>
      <span class="scheiding"></span>
      <button type="button" id="btn-csv">Export CSV</button>
      <button type="button" id="btn-json">Export JSON</button>
    </nav>
    <div class="status"><span id="mapnaam"></span><span id="opslagstatus"></span></div>
  </header>
  <div id="melding" hidden></div>
  <main id="main"></main>

  <dialog id="dlg">
    <div id="dlg-inhoud"></div>
    <div class="knoppen">
      <button type="button" id="dlg-nee">Annuleren</button>
      <button type="button" id="dlg-ja" class="primair">Bevestigen</button>
    </div>
  </dialog>

  <div id="lb" hidden>
    <div class="lb-kop">
      <span class="lb-run" id="lb-run"></span>
      <span class="lb-moment" id="lb-moment"></span>
      <span class="lb-naam" id="lb-naam"></span>
      <span class="flex"></span>
      <span class="lb-teller" id="lb-teller"></span>
      <button type="button" id="lb-sluit" title="Sluiten (Esc)">✕</button>
    </div>
    <div class="lb-beeld">
      <button type="button" class="lb-pijl" id="lb-vorige" title="Vorige (←)">‹</button>
      <img id="lb-img" alt="">
      <button type="button" class="lb-pijl" id="lb-volgende" title="Volgende (→)">›</button>
    </div>
    <div class="lb-voet">← → bladeren · Home / End eerste / laatste · Esc sluiten</div>
  </div>

  <script>window.COVO_VIEWER = true;</script>
  <script>/* js/parser.js */
'use strict';
/*
 * Leest de tekstoutput van de COVO-Validator.
 * Robuust geschreven: ontbrekende of afwijkende regels worden overgeslagen
 * en leveren een waarschuwing op in plaats van een fout.
 * Verhoog PARSER_VERSIE bij elke inhoudelijke wijziging aan de parser.
 */
const PARSER_VERSIE = 1;

function parseValidatorOutput(tekst) {
  const res = {
    parserVersie: PARSER_VERSIE,
    herkend: false,
    aantalRapporten: 0,
    status: null,
    modus: null,
    selectie: { views: null, elements: null, horizontal: null, vertical: null },
    samenvatting: {},
    samenvattingAfgeleid: false,
    secties: [],

    const r = ruw.trim();

      sectie.blokken.push(blok);
      continue;
    }

    if (inKop) {
      if (!r) continue;
      if ((m = r.match(/^VIEW:\s*(.*?)\s*\((\d+)\s+violations?\)\s*$/i))) {
        sectie.soort = 'view'; sectie.view = m[1]; sectie.aantal = +m[2]; sectie.titel = r;

        sectie.soort = 'view'; sectie.view = m[1]; sectie.titel = r;
      } else if ((m = r.match(/^Type:\s*(.*)$/i))) {
        sectie.type = m[1];
      } else if ((m = r.match(/^Path:\s*(.*)$/i))) {
        sectie.pad = m[1];
      } else {
        if (/GLOBAL/i.test(r)) sectie.soort = 'globaal';
        if (!sectie.titel) sectie.titel = r;
      }
      continue;
    }

    if ((m = r.match(/^OVERALL STATUS:\s*([A-Za-z]+)/i))) { res.status = m[1].toUpperCase(); fase = null; continue; }
    if (/^SELECTION:?$/i.test(r)) { fase = 'selectie'; blok = null; continue; }
    if (/^VIOLATION SUMMARY:?$/i.test(r)) { fase = 'samenvatting'; blok = null; continue; }
    if ((m = r.match(/Validation completed in\s+(\d+)\s*ms/i))) { res.duurMs = +m[1]; fase = null; blok = null; continue; }
    if (!r) { blok = null; continue; }

    if (fase === 'selectie') {
      if ((m = r.match(/^-\s*(CONSTRUCTION|AUDIT)\s+mode/i))) res.modus = m[1].toLowerCase();
      else if ((m = r.match(/^-\s*(\d+)\s+views?\b/i))) res.selectie.views = +m[1];
      else if ((m = r.match(/^-\s*(\d+)\s+elements?\b/i))) res.selectie.elements = +m[1];
      else if ((m = r.match(/^-\s*(\d+)\s+horizontal\s+relationships?\b/i))) res.selectie.horizontal = +m[1];
      else if ((m = r.match(/^-\s*(\d+)\s+vertical\s+relationships?\b/i))) res.selectie.vertical = +m[1];

    if (fase === 'samenvatting') {
      if ((m = r.match(/^-\s*([A-Za-z]+\d+)\s*:\s*(\d+)\s+violations?/i))) res.samenvatting[m[1].toUpperCase()] = +m[2];

  if (!res.modus) {
    const m = tekst.match(/\b(CONSTRUCTION|AUDIT)\s+mode\b/i);
    if (m) res.modus = m[1].toLowerCase();

  // Controle: aantallen uit de samenvatting tegenover wat de blokken tonen.
  const uitBlokken = {};
  for (const s of res.secties) for (const b of s.blokken) {
    uitBlokken[b.code] = (uitBlokken[b.code] || 0) + b.items.length + b.meer;
  }
  const w = res.waarschuwingen;
  if (!res.herkend) w.push('Geen COVO-rapport herkend in de tekst.');
  if (res.aantalRapporten > 1) w.push(`De tekst bevat ${res.aantalRapporten} rapporten; alleen het eerste is gelezen.`);
  if (res.herkend && !res.status) w.push('OVERALL STATUS niet gevonden.');
  if (res.herkend && !res.modus) w.push('Modus (CONSTRUCTION/AUDIT) niet gevonden.');
  if (!Object.keys(res.samenvatting).length && Object.keys(uitBlokken).length) {
    res.samenvatting = { ...uitBlokken };
    res.samenvattingAfgeleid = true;
    w.push('Geen VIOLATION SUMMARY gevonden; aantallen afgeleid uit de meldingsblokken.');
  } else {
    for (const code of Object.keys(res.samenvatting)) {
      if (!(code in uitBlokken)) w.push(`${code} staat in de samenvatting, maar er is geen meldingsblok gevonden.`);
      else if (uitBlokken[code] !== res.samenvatting[code]) w.push(`${code}: samenvatting telt ${res.samenvatting[code]}, de blokken samen ${uitBlokken[code]}.`);
    }
    for (const code of Object.keys(uitBlokken)) {
      if (!(code in res.samenvatting)) w.push(`${code} heeft een meldingsblok, maar staat niet in de samenvatting.`);
    }
  }
  const totaal = Object.values(res.samenvatting).reduce((a, b) => a + b, 0);
  if (res.status === 'FAILED' && totaal === 0) w.push('Status FAILED, maar geen meldingen gevonden.');
  if (res.status === 'PASSED' && totaal > 0) w.push('Status PASSED, maar er zijn meldingen gevonden.');
  return res;
}

/* Alle (unieke) meldingen van één constraint, over alle secties heen. */
function meldingenVoor(p, code) {
  const items = [], gezien = new Set();
  let titel = null;
  for (const s of (p && p.secties) || []) for (const b of s.blokken) {
    if (b.code !== code) continue;
    if (titel === null) titel = b.titel;
    for (const it of b.items) if (!gezien.has(it)) { gezien.add(it); items.push(it); }
  }
  return { titel, items, totaal: p && p.samenvatting[code] != null ? p.samenvatting[code] : null };

'use strict';
/* Afgeleide gegevens: runnummers, chronologie, gevolg, waarschuwingen, overzichten. */

const LABELS = {
  object: { relatie: 'Relatie', element: 'Element', niet_opgelost: 'Bewust niet opgelost' },
  soort: { toevoegen: 'Toevoegen', verwijderen: 'Verwijderen', verplaatsen: 'Verplaatsen', hernoemen: 'Hernoemen', type_gewijzigd: 'Type gewijzigd' },
  behulpzaam: { ja: 'Ja', nee: 'Nee', twijfel: 'Twijfel', nvt: 'Nvt' },
  req: { nee: 'Nee', geraakt: 'Geraakt', verfijnd: 'Verfijnd' },
  modus: { construction: 'Construction', audit: 'Audit' },
  status: { concept: 'concept', afgerond: 'afgerond' },
  recordtype: { wijziging: 'TO-BE-wijziging', correctie: 'COVO-correctie' },
  type: { covo: 'COVO-iteratie', 'tobe-zonder': 'TO-BE zonder COVO', 'tobe-met': 'TO-BE met COVO' }

const OBJECTEN = ['relatie', 'element'];
/* R1.01 (COVO: prefix + groep), T1.01 / T2.01 (TO-BE: vaste prefix) */
const RUN_RE = /^([A-Z]+)(\d+)\.(\d+)$/;

const p2 = n => String(n).padStart(2, '0');

function nuTijd() { const d = new Date(); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; }
function isoNu() { return `${vandaag()}T${nuTijd()}`; }
function toonDatum(iso) { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; }

function duurMinuten(r) {

  const ms = new Date(`${r.aft.datum}T${r.aft.tijd}`) - new Date(`${r.pre.datum}T${r.pre.tijd}`);
  return Number.isFinite(ms) && ms >= 0 ? Math.round(ms / 60000) : null;

/* ---------- runs ---------- */
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function groepVan(run) { const m = RUN_RE.exec((run || '').trim()); return m ? +m[2] : null; }

}
function runPatroon(o) {

  const t = `${LABELS.object[a.object].toLowerCase()} ${(LABELS.soort[a.soort] || a.soort).toLowerCase()}`;

    const items = meldingenVoor(aft, code).items.filter(x => !voor.has(x));
    const voorAfgekapt = afgekapt(pre, code), naAfgekapt = afgekapt(aft, code);
    const stijging = (aft.samenvatting[code] || 0) > (pre.samenvatting[code] || 0);

}
function berekenGevolg(pre, aft) {
  const codes = [...new Set([...Object.keys(pre.samenvatting), ...Object.keys(aft.samenvatting)])].sort();
  const per = codes.map(c => ({ code: c, voor: pre.samenvatting[c] || 0, na: aft.samenvatting[c] || 0 }));
  return {
    perConstraint: per,
    nieuw: per.filter(x => x.voor === 0 && x.na > 0).map(x => x.code),
    verdwenen: per.filter(x => x.voor > 0 && x.na === 0).map(x => x.code),
    toegenomen: per.filter(x => x.voor > 0 && x.na > x.voor).map(x => x.code),
    toename: per.reduce((s, x) => s + Math.max(0, x.na - x.voor), 0),
    meldingenNieuw: nieuweMeldingen(pre, aft),

    statusNa: aft.status,

    totaalNa: per.reduce((a, x) => a + x.na, 0),

function normTekst(t) {

    .map(l => l.trim())
    .filter(l => l && !/Validation completed in/i.test(l))

function berekenWaarschuwingen(r, vorig, pre, aft) {
  const w = [];

    w.push(`Pre_Validatoroutput verschilt van de Aft_Validatoroutput van het vorige record (${vorig.run}): toestand veranderd buiten de log?`);
  }

    const versch = Object.keys(namen).filter(k => pre.selectie[k] !== aft.selectie[k])
      .map(k => `${namen[k]} ${pre.selectie[k] ?? '?'} → ${aft.selectie[k] ?? '?'}`);

/* ---------- vergelijking bij opnieuw parsen ---------- */
function vergelijkParsed(a, b) {

  const f = x => (x === null || x === undefined ? '–' : x);
  const z = (label, x, y) => { if (JSON.stringify(x) !== JSON.stringify(y)) v.push(`${label}: ${f(x)} → ${f(y)}`); };
  z('Status', a.status, b.status);
  z('Modus', a.modus, b.modus);
  for (const k of Object.keys(b.selectie)) z(`Selectie ${k}`, a.selectie[k], b.selectie[k]);

  for (const c of codes) z(`Aantal ${c}`, a.samenvatting[c], b.samenvatting[c]);

    aantal: recs.length,
    afgerond: recs.filter(r => r.status === 'afgerond').length,
    eerste: null, laatste: null,
    acties: leegActies(), nietOpgelost: 0,
    intuitief: {},

    }
    if (r.gevolg && (r.gevolg.nieuw.length || r.gevolg.toegenomen.length)) {
      o.nieuweMeldingen.push({ run: r.run, id: r.id, nieuw: r.gevolg.nieuw, toegenomen: r.gevolg.toegenomen, tekst: r.gevolg.tekst });

function tobeRij() {
  return { records: 0, wijzigingen: 0, correcties: 0, acties: leegActies(), actiesTotaal: 0, duur: 0, duurOnbekend: 0, toename: 0, nieuweConstraints: 0, runs: [] };
}
function voegTobeToe(x, r) {
  x.records++;
  if (r.recordtype === 'wijziging') x.wijzigingen++;
  if (r.recordtype === 'correctie') x.correcties++;
  for (const a of r.acties) {
    if (a.object === 'niet_opgelost' || !x.acties[a.object] || !(a.soort in x.acties[a.object])) continue;
    x.acties[a.object][a.soort] += a.aantal || 0;
    x.actiesTotaal += a.aantal || 0;

}
/* Records met meerdere requirements tellen bij elk requirement mee; "totaal" telt elk record één keer. */
function overzichtTobe(recs, reqLijst) {
  const per = new Map(reqLijst.map(q => [q, tobeRij()]));
  const zonder = tobeRij(), totaal = tobeRij();
  for (const r of recs) {
    if (r.tobeRequirements.length) {
      for (const q of r.tobeRequirements) {
        if (!per.has(q)) per.set(q, tobeRij());
        voegTobeToe(per.get(q), r);
      }
    } else voegTobeToe(zonder, r);
    voegTobeToe(totaal, r);
  }
  return { per, zonder, totaal };
}

'use strict';
/*
 * Opslag via de File System Access API.
 * - De gekozen map wordt als handle in IndexedDB onthouden (niet de gegevens zelf).
 * - log.json bevat alles; per dag één log.backup-<datum>.json met de toestand
 *   van vóór de eerste wijziging van die dag.
 * - Screenshots in de submap screenshots/.

const Opslag = (() => {
  const DB = 'covo-logtool', ST = 'kv';

  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(ST);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idb(modus, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction(ST, modus);
      const req = fn(tx.objectStore(ST));
      tx.oncomplete = () => res(req.result);
      tx.onerror = () => rej(tx.error);
    });
  }

  const haalBewaardeMap = () => idb('readonly', s => s.get('map'));
  const onthoudMap = h => idb('readwrite', s => s.put(h, 'map'));
  const kiesMap = () => window.showDirectoryPicker({ id: 'covo-logtool', mode: 'readwrite' });

  async function toestemming(h, vraag) {
    if (typeof h.queryPermission !== 'function') return true;
    const o = { mode: 'readwrite' };
    if ((await h.queryPermission(o)) === 'granted') return true;
    if (vraag) return (await h.requestPermission(o)) === 'granted';
    return false;
  }

  async function bestaat(dir, naam) {
    try { await dir.getFileHandle(naam); return true; }

  async function naarPng(blob) {

  const urlCache = new Map();
  async function screenshotUrl(map, naam) {
    if (window.COVO_VIEWER) return `screenshots/${encodeURIComponent(naam)}`; // viewer: map naast de pagina
    if (urlCache.has(naam)) return urlCache.get(naam);

  async function hernoemScreenshot(map, oud, basis) {

      .then(() => { savePending = false; zetStatus('Opgeslagen ' + nuTijd()); })
      .catch(e => { zetStatus('Fout bij opslaan!', true); toonMelding('Opslaan mislukt: ' + e.message, 'fout'); });
  };

}
function bewaarWerkversie() { S.data.werkversie = S.ed; bewaarLog(); }
function zetStatus(t, fout) { const el = $('#opslagstatus'); el.textContent = t; el.classList.toggle('fout', !!fout); }

let meldingTimer = null;
function toonMelding(t, soort = 'info') {
  const el = $('#melding');
  el.className = soort; el.textContent = t; el.hidden = false;
  clearTimeout(meldingTimer);
  if (soort !== 'fout') meldingTimer = setTimeout(() => { el.hidden = true; }, 7000);
  else el.onclick = () => { el.hidden = true; };

function bevestig(html, jaTekst = 'Bevestigen', gevaar = false) {
  return new Promise(res => {
    const d = $('#dlg'), ja = $('#dlg-ja'), nee = $('#dlg-nee');
    $('#dlg-inhoud').innerHTML = html;

}

/* ================= opstart ================= */

document.addEventListener('DOMContentLoaded', start);
window.addEventListener('beforeunload', e => { if (savePending) { e.preventDefault(); e.returnValue = ''; } });

async function start() {
  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('[data-scherm]');
    if (!b || !S.data) return;
    if (window.COVO_VIEWER && ['invoer', 'instellingen'].includes(b.dataset.scherm)) return;
    if (b.dataset.scherm === 'invoer' && !S.ed) { startNieuw(); return; }
    S.scherm = b.dataset.scherm;
    if (S.scherm !== 'tabel') S.detailId = null;
    render();
  });
  $('#onderdeel').addEventListener('change', e => kiesOnderdeel(e.target.value));
  $('#btn-csv').addEventListener('click', () => S.data && exporteerCsv(S.data, actief()));
  $('#btn-json').addEventListener('click', () => S.data && exporteerJson(S.data));
  bindLightbox();
  bindToetsen();

  if (window.COVO_VIEWER) { startViewer(); return; }
  if (!('showDirectoryPicker' in window)) { toonStart('geenapi'); return; }
  let h = null;
  try { h = await Opslag.haalBewaardeMap(); } catch (e) { /* geen bewaarde map */ }
  if (!h) { toonStart('kies'); return; }
  if (await Opslag.toestemming(h, false)) await openMap(h);
  else toonStart('hervat', h);
}

function toonStart(soort, h) {
  document.body.classList.remove('geladen');
  const m = $('#main');
  if (soort === 'geenapi') {
    m.innerHTML = `<section class="kaart start"><h2>Browser niet ondersteund</h2>
      <p>Deze tool gebruikt de File System Access API. Open <code>index.html</code> in Google Chrome of Microsoft Edge.</p></section>`;
    return;
  }
  m.innerHTML = soort === 'hervat'
    ? `<section class="kaart start"><h2>Toegang tot de gegevensmap</h2>
        <p>De tool werkte met de map <b>${esc(h.name)}</b>. De browser vraagt opnieuw toestemming om die map te lezen en te schrijven.</p>
        <p><button class="primair" id="st-hervat">Toegang geven tot “${esc(h.name)}”</button> <button id="st-kies">Andere map kiezen</button></p></section>`
    : `<section class="kaart start"><h2>Welkom</h2>
        <p>Kies de map waarin de log bewaard wordt, bijvoorbeeld een map in OneDrive. De tool maakt daarin <code>log.json</code>, dagelijkse back-ups en een map <code>screenshots/</code>.</p>
        <p><button class="primair" id="st-kies">Gegevensmap kiezen</button></p></section>`;
  const hv = $('#st-hervat');
  if (hv) hv.addEventListener('click', async () => { if (await Opslag.toestemming(h, true)) openMap(h); });
  $('#st-kies').addEventListener('click', kiesAndereMap);
}
async function kiesAndereMap() {
  try { await openMap(await Opslag.kiesMap()); }
  catch (e) { if (e.name !== 'AbortError') toonMelding(e.message, 'fout'); }
}
/* Viewer (covo-viewer.html op een webserver): leest log.json naast de pagina, alleen-lezen, schrijft nooit. */
async function startViewer() {
  document.body.classList.add('viewer');
  S.alleenLezen = true;
  const fout = (titel, html) => { $('#main').innerHTML = `<section class="kaart start"><h2>${titel}</h2>${html}</section>`; };
  let tekst;
  try {
    const r = await fetch('log.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    tekst = await r.text();
  } catch (e) {
    fout('Log niet gevonden', `<p>Zet <code>log.json</code> en de map <code>screenshots/</code> in dezelfde map als deze pagina, op een webserver (${esc(e.message)}).</p>`);
    return;
  }
  let d;
  try { d = JSON.parse(tekst); }
  catch (e) { fout('log.json is beschadigd', `<p>${esc(e.message)}</p>`); return; }
  if ((d.schemaVersion || 1) > SCHEMA_VERSIE) { fout('Log is nieuwer dan deze viewer', '<p>Gebruik een recentere versie van de viewer.</p>'); return; }
  S.data = migreer(d); // alleen in het geheugen
  S.data.werkversie = null;
  const laatst = S.data.records.map(r => r.gewijzigd || '').sort().pop();
  $('#mapnaam').textContent = `Alleen-lezen${laatst ? ` · stand van ${toonDatum(laatst)}` : ''}`;
  document.body.classList.add('geladen');
  S.scherm = 'tabel';
  render();
}
function toonBlokkade(titel, html) {
  S.alleenLezen = true;
  document.body.classList.remove('geladen');
  $('#main').innerHTML = `<section class="kaart start"><h2>${titel}</h2>${html}
    <p>De tool schrijft niets weg zolang dit niet opgelost is.</p></section>`;
}
async function openMap(h) {
  S.map = h; S.ed = null; S.open.clear(); S.detailId = null; S.filters = leegFilter(); S.alleenLezen = false;
  try { await Opslag.onthoudMap(h); } catch (e) { /* niet fataal */ }
  $('#mapnaam').textContent = '📁 ' + h.name;
  let t;
  try { t = await Opslag.leesTekst(h, 'log.json'); }
  catch (e) { toonMelding('log.json kan niet gelezen worden: ' + e.message, 'fout'); return; }
  if (t === null) {
    S.data = nieuweData();
    bewaarLog(true);
  } else {
    let ruw;
    try { ruw = JSON.parse(t); }
    catch (e) {
      toonBlokkade('log.json is beschadigd', `<p>${esc(e.message)}</p><p>Herstel eventueel een <code>log.backup-…json</code> door het te hernoemen naar <code>log.json</code>.</p>`);
      return;
    }
    const versie = ruw.schemaVersion || 1;
    if (versie > SCHEMA_VERSIE) {
      toonBlokkade('Log is nieuwer dan deze tool', `<p>Dit log heeft schemaversie ${versie}; deze tool kent versie ${SCHEMA_VERSIE}. Gebruik een recentere versie van de tool.</p>`);
      return;
    }
    if (versie < SCHEMA_VERSIE) {
      if (!(await migreerMetBackup(h, t, versie))) return;
    } else S.data = migreer(ruw);
  }
  document.body.classList.add('geladen');
  S.scherm = 'tijdlijn';
  if (S.data.werkversie) {
    S.ed = S.data.werkversie;
    S.data.actiefOnderdeel = S.ed.rec.onderdeel;
    S.scherm = 'invoer';
    toonMelding('Niet-bewaarde invoer van de vorige keer is hersteld.');
  }
  render();
}
/* Migratie: 1) back-up schrijven en controleren, 2) migreren in het geheugen,
   3) zelfcontrole (niets gewijzigd of verwijderd), 4) pas dan wegschrijven. */
async function migreerMetBackup(h, tekst, vanVersie) {
  let backup;
  try { backup = await Opslag.backupVoorMigratie(h); }
  catch (e) {
    toonBlokkade('Migratie gestopt', `<p>De back-up vóór de migratie kon niet veilig geschreven worden: ${esc(e.message)}</p>`);
    return false;
  }
  const d = migreer(JSON.parse(tekst));
  const fout = verschillen(JSON.parse(tekst), d).filter(p => !TOEGESTANE_WIJZIGINGEN.test(p));
  if (fout.length) {
    toonBlokkade('Migratie gestopt', `<p>De zelfcontrole vond gewijzigde of ontbrekende waarden:</p><ul>${fout.slice(0, 10).map(p => `<li><code>${esc(p)}</code></li>`).join('')}</ul>
      <p><code>log.json</code> is niet aangepast. De back-up staat in <code>${esc(backup)}</code>.</p>`);
    return false;
  }
  d.migraties.push({ van: vanVersie, naar: SCHEMA_VERSIE, datum: isoNu(), backup });
  S.data = d;
  bewaarLog(true);
  toonMelding(`Log omgezet naar versie ${SCHEMA_VERSIE} (${d.records.length} records). Back-up van vóór de omzetting: ${backup}.`);
  return true;
}

/* ================= render & navigatie ================= */

function kiesOnderdeel(id) {
  if (S.ed || !onderdeelVan(id)) return;
  S.data.actiefOnderdeel = id;
  S.filters = leegFilter(); S.open.clear(); S.detailId = null;

}
function render() {
  const o = actief();
  document.body.dataset.type = o.type;
  const sel = $('#onderdeel');
  sel.innerHTML = onderdelen().map(x => `<option value="${esc(x.id)}" ${x.id === o.id ? 'selected' : ''}>${esc(x.naam)}</option>`).join('');
  sel.disabled = !!S.ed;
  sel.title = S.ed ? 'Rond eerst de invoer af of annuleer ze.' : '';
  const heeftTobe = ['tobe-zonder', 'tobe-met'].every(t => onderdelen().some(x => x.type === t));
  $('#nav-vergelijking').hidden = !heeftTobe;
  if (S.scherm === 'vergelijking' && !heeftTobe) S.scherm = 'tijdlijn';
  $$('#nav [data-scherm]').forEach(b => b.classList.toggle('actief', b.dataset.scherm === S.scherm));
  $('#nav-invoer').textContent = S.ed ? '✎ Invoer (bezig)' : '+ Nieuw record';
  $('#btn-csv').title = `CSV van “${o.naam}”`;

  if (S.scherm === 'invoer' && S.ed) renderEditor(m);
  else if (S.scherm === 'tabel') renderTabel(m);
  else if (S.scherm === 'overzicht') renderOverzicht(m);
  else if (S.scherm === 'vergelijking') renderVergelijking(m);
  else if (S.scherm === 'instellingen') renderInstellingen(m);
  else { S.scherm = 'tijdlijn'; renderTijdlijn(m); }
}

/* ================= filters & zoeken ================= */

function filterBalk(alleRecs, type) {
  const f = S.filters;
  const sel = (naam, label, opties) => `<label>${label} <select data-filter="${naam}"><option value="">alle</option>${opties.map(([v, l]) => `<option value="${esc(v)}" ${String(f[naam]) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  const groepen = [...new Set(alleRecs.map(r => groepVan(r.run)).filter(g => g !== null))].sort((a, b) => a - b);
  const cons = [...new Set(alleRecs.flatMap(r => r.constraints))].sort();
  const treqs = [...new Set([...S.data.settings.tobeRequirements, ...alleRecs.flatMap(r => r.tobeRequirements)])];
  const views = [...new Set([...viewsVan(actief()), ...alleRecs.flatMap(r => r.views)])];
  const delen = [];
  if (type === 'covo') delen.push(sel('groep', 'Groep', groepen.map(g => [g, 'Groep ' + g])));
  if (type === 'tobe-met') delen.push(sel('recordtype', 'Type', Object.entries(LABELS.recordtype)));
  if (type !== 'covo') delen.push(sel('tobereq', 'Requirement', treqs.map(q => [q, q])));
  if (type !== 'tobe-zonder') delen.push(sel('constraint', 'Constraint', cons.map(c => [c, c])));
  delen.push(sel('view', 'View', views.map(v => [v, v])));
  if (type !== 'tobe-zonder') delen.push(sel('modus', 'Modus', Object.entries(LABELS.modus)));
  delen.push(`<label>Zoeken <input type="search" data-filter="zoek" value="${esc(f.zoek)}" placeholder="in run en beschrijving"></label>`);
  return `<div class="filters">${delen.join('')}
    ${Object.values(f).some(Boolean) ? '<button type="button" class="klein" data-action="wis-filters">Filters wissen</button>' : ''}</div>`;
}
function pasFilterToe(recs) {
  const f = S.filters, z = f.zoek.trim().toLowerCase();
  return recs.filter(r =>
    (!f.groep || String(groepVan(r.run)) === String(f.groep)) &&
    (!f.constraint || r.constraints.includes(f.constraint)) &&
    (!f.tobereq || r.tobeRequirements.includes(f.tobereq)) &&
    (!f.view || r.views.includes(f.view)) &&
    (!f.modus || r.modus === f.modus) &&
    (!f.recordtype || r.recordtype === f.recordtype) &&
    (!z || `${r.run}\n${r.beschrijving}`.toLowerCase().includes(z)));
}
function bindFilters(m) {
  m.addEventListener('change', ev => {
    const s = ev.target.closest('select[data-filter]');
    if (s) { S.filters[s.dataset.filter] = s.value; S.detailId = null; render(); }
  });
  m.addEventListener('input', ev => {
    const z = ev.target.closest('input[data-filter="zoek"]');
    if (!z) return;
    S.filters.zoek = z.value; S.detailId = null;
    const pos = z.selectionStart;
    render();
    const nieuw = $('input[data-filter="zoek"]');
    if (nieuw) { nieuw.focus(); nieuw.setSelectionRange(pos, pos); }
  });
  m.addEventListener('click', ev => {
    if (ev.target.closest('[data-action="wis-filters"]')) { S.filters = leegFilter(); S.detailId = null; render(); }
  });
}

/* ================= lightbox ================= */

/* Alle screenshots van een reeks records, in volgorde: per record PRE 1..n, dan AFT 1..n. */
function lbItems(recs) {
  return recs.flatMap(r => ['pre', 'aft'].flatMap(side => r[side].screenshots.map((s, i) => ({
    naam: s.naam, eigen: s.eigen, run: r.run || '(geen run)', recId: r.id, side, nr: i + 1, van: r[side].screenshots.length
  }))));
}
const LB = { items: [], i: 0 };
function openLightbox(items, index) {
  if (!items.length) return;
  LB.items = items; LB.i = Math.max(0, Math.min(index, items.length - 1));
  $('#lb').hidden = false;
  toonLightbox();
}
async function toonLightbox() {
  const it = LB.items[LB.i];
  $('#lb-run').textContent = it.run;
  const m = $('#lb-moment');
  m.textContent = `${it.side.toUpperCase()} ${it.nr}/${it.van}`;
  m.className = 'lb-moment ' + it.side;
  $('#lb-naam').textContent = it.naam + (it.side === 'pre' && !it.eigen ? ' (overgenomen van vorig record)' : '');
  $('#lb-teller').textContent = `${LB.i + 1} / ${LB.items.length}`;
  $('#lb-vorige').disabled = LB.i === 0;
  $('#lb-volgende').disabled = LB.i === LB.items.length - 1;
  const img = $('#lb-img');
  img.removeAttribute('src');
  img.alt = `${it.run} ${it.side.toUpperCase()} ${it.nr}`;
  const url = await Opslag.screenshotUrl(S.map, it.naam);
  if (LB.items[LB.i] === it) { if (url) img.src = url; else img.alt = 'Bestand niet gevonden: ' + it.naam; }
}
function bladerLightbox(naar) {
  const j = Math.max(0, Math.min(naar, LB.items.length - 1));
  if (j !== LB.i) { LB.i = j; toonLightbox(); }
}
const sluitLightbox = () => { $('#lb').hidden = true; };
function bindLightbox() {
  $('#lb-sluit').addEventListener('click', sluitLightbox);
  $('#lb-vorige').addEventListener('click', () => bladerLightbox(LB.i - 1));
  $('#lb-volgende').addEventListener('click', () => bladerLightbox(LB.i + 1));
  $('#lb').addEventListener('click', ev => { if (ev.target.classList.contains('lb-beeld')) sluitLightbox(); });
}

/* Pijltjestoetsen: in de lightbox door de afbeeldingen, anders in de detailweergave door de records. */
function bindToetsen() {
  document.addEventListener('keydown', ev => {
    if (!$('#lb').hidden) {
      const acties = {
        ArrowLeft: () => bladerLightbox(LB.i - 1), ArrowUp: () => bladerLightbox(LB.i - 1),
        ArrowRight: () => bladerLightbox(LB.i + 1), ArrowDown: () => bladerLightbox(LB.i + 1),
        Home: () => bladerLightbox(0), End: () => bladerLightbox(LB.items.length - 1),
        Escape: sluitLightbox
      };
      if (acties[ev.key]) { ev.preventDefault(); acties[ev.key](); }
      return;
    }
    if ($('#dlg').open || S.scherm !== 'tabel' || !S.detailId) return;
    if (ev.target instanceof Element && ev.target.closest('input, textarea, select, [contenteditable]')) return;
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') { ev.preventDefault(); bladerDetail(-1); }
    else if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') { ev.preventDefault(); bladerDetail(1); }
    else if (ev.key === 'Escape') { S.detailId = null; render(); }
  });
}

</script>
  <script>/* js/invoer.js */
'use strict';
/* Invoer in drie stappen. Het formulier hangt af van het type van het onderdeel:
   covo (COVO-iteratie), tobe-zonder (TO-BE, model zonder COVO), tobe-met (TO-BE, model met COVO). */

let edItems = {};        // meldingen per constraint zoals getoond in stap 2
const liveCache = { pre: { t: null, p: null }, aft: { t: null, p: null } };

const edOnderdeel = () => onderdeelVan(S.ed.rec.onderdeel) || actief();
const edType = () => edOnderdeel().type;
const isCorrectie = () => edType() === 'tobe-met' && S.ed.rec.recordtype === 'correctie';
const toontConstraints = () => edType() === 'covo' || isCorrectie();

function startNieuw() {
  const o = actief();
  const r = nieuwRecord(o.id);
  const vorigEigen = vorigBinnen(o.id, null);
  r.run = vorigEigen ? (volgendeRun(vorigEigen.run) || eersteRun(o)) : eersteRun(o);
  const bron = vorigVoor(r, null);
  if (bron) {
    r.pre.screenshots = bron.aft.screenshots.map(s => ({ naam: s.naam, eigen: false }));
    if (o.type !== 'tobe-zonder') { r.pre.output = bron.aft.output || ''; r.build = bron.build || ''; }
  }
  if (o.type === 'tobe-met') r.recordtype = 'wijziging';
  if (o.type !== 'tobe-zonder') r.modus = parseValidatorOutput(r.pre.output).modus;
  S.ed = { rec: r, origId: null, stap: 1 };
  S.scherm = 'invoer';
  bewaarWerkversie();
  render();
}
async function startBewerken(id) {
  if (S.ed && !(await bevestig('<p>Er is al een invoer bezig. Die werkkopie gaat verloren. Doorgaan?</p>', 'Doorgaan', true))) return;
  const o = zoek(id);
  S.ed = { rec: structuredClone(o), origId: id, stap: o.status === 'concept' ? (o.aft.output || o.aft.datum ? 3 : 2) : 1 };
  S.data.actiefOnderdeel = o.onderdeel;
  S.scherm = 'invoer';
  bewaarWerkversie();
  render();
}
const origRec = () => (S.ed && S.ed.origId ? zoek(S.ed.origId) : null);

/* Geparste gegevens om te tonen: vastgelegd (indien tekst ongewijzigd) of live. */
function parsedVoor(side) {
  const r = S.ed.rec, o = origRec();
  if (o && o[side].parsed && o[side].output === r[side].output) return { p: o[side].parsed, vast: true };
  const c = liveCache[side];
  if (c.t !== r[side].output) { c.t = r[side].output; c.p = parseValidatorOutput(c.t); }
  return { p: c.p, vast: false };
}

const veld = (label, inhoud, extra = '') => `<label class="veld ${extra}"><span class="label">${label}</span>${inhoud}</label>`;
const radio = (bind, waarde, label, huidig, naam) =>
  `<label class="keuze"><input type="radio" name="${naam || bind}" data-bind="${bind}" value="${waarde}" ${huidig === waarde ? 'checked' : ''}> ${label}</label>`;

function outputBlok(side, label, openAlsLeeg = true) {
  const t = S.ed.rec[side].output;
  return `<details class="output" id="${side}-details" ${!t && openAlsLeeg ? 'open' : ''}>
    <summary><b>${label}</b> <span class="samenv" id="${side}-samenv"></span></summary>

      <textarea data-bind="${side}.output" spellcheck="false" rows="20" placeholder="Plak hier de volledige validatoroutput (Ctrl+V)">${esc(t)}</textarea>
      <div class="parsed" id="${side}-parsed"></div>
    </div>
